# SPDX-License-Identifier: MIT
name: NSS-USBNET-v0.1

on:
  # A new workflow on a development-only branch cannot initially be dispatched
  # through the default branch's Actions UI. A future, user-authorized push of
  # these experiment files can bootstrap it without changing main.
  push:
    branches: [nss-usbnet-dev]
    paths:
      - '.github/workflows/NSS-USBNET.yml'
      - 'Packages/nss-usbnet/**'
      - 'Scripts/PRIVATE.sh'
      - 'Scripts/NSS-Usbnet-Artifacts.py'
      - 'Config/PRIVATE.txt'
      - 'Config/IPQ60XX-NSS-USBNET.txt'
      - 'Config/NSS-USBNET-feeds.conf'
  workflow_dispatch:

# This workflow cannot write releases, tags, branches, or shared build caches.
permissions:
  contents: read

concurrency:
  group: nss-usbnet-experiment-${{ github.ref }}
  cancel-in-progress: false

env:
  NSS_USBNET_EXPERIMENT: '1'
  WRT_CONFIG: IPQ60XX-NSS-USBNET
  SOURCE_COMMIT: '0fb9b10cb9df51fb076470e1dd93d1c30dd89d83'

jobs:
  experiment:
    if: github.ref == 'refs/heads/nss-usbnet-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            curl ca-certificates libelf-dev libfuse-dev xsltproc patch time kmod
          mkdir -p artifacts/nss-usbnet/logs
          dpkg-query -W > artifacts/nss-usbnet/logs/host-packages.txt
          df -h > artifacts/nss-usbnet/logs/disk-space.txt

      - name: Fetch pinned source
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git init wrt
          git -C wrt remote add origin https://github.com/VIKINGYFY/immortalwrt.git
          git -C wrt fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C wrt checkout --detach FETCH_HEAD
          [[ "$(git -C wrt rev-parse HEAD)" == "$SOURCE_COMMIT" ]]

      - name: Update feeds and reuse private injection hook
        run: |
          set -euo pipefail
          cd wrt
          cp "$GITHUB_WORKSPACE/Config/NSS-USBNET-feeds.conf" feeds.conf
          ./scripts/feeds update -a 2>&1 | tee ../artifacts/nss-usbnet/logs/feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee ../artifacts/nss-usbnet/logs/feeds-install.log
          # This unused audio recipe causes a Kconfig dependency cycle in the
          # locked baseline. Remove only its generated feed installation link.
          ./scripts/feeds uninstall squeezelite 2>&1 | tee ../artifacts/nss-usbnet/logs/feeds-exclusions.log
          cd package
          # shellcheck source=Scripts/PRIVATE.sh
          source "$GITHUB_WORKSPACE/Scripts/PRIVATE.sh"

      - name: Configure new paired firmware and manual probe package
        run: |
          set -euo pipefail
          cd wrt
          cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" \
            "$GITHUB_WORKSPACE/Config/PRIVATE.txt" > .config
          # Same ordering as Settings.sh: private fragment, then opt-in override.
          echo 'CONFIG_PACKAGE_kmod-nss-usbnet=m' >> .config
          make defconfig 2>&1 | tee ../artifacts/nss-usbnet/logs/defconfig.log
          # The upstream wrapper can exit zero despite a Kconfig parse error.
          if grep -qiE 'error:|recursive dependency detected' ../artifacts/nss-usbnet/logs/defconfig.log; then
            exit 1
          fi
          grep -qx 'CONFIG_PACKAGE_kmod-nss-usbnet=m' .config
          grep -qx 'CONFIG_PACKAGE_nss-firmware=y' .config
          grep -qx 'CONFIG_KERNEL_DEBUG_FS=y' .config
          if ! grep -qx '# CONFIG_PACKAGE_luci-app-fullconenat-sonic is not set' .config; then
            echo 'NSS experiment requires luci-app-fullconenat-sonic to remain disabled after defconfig' >&2
            exit 1
          fi
          grep -qE '^[[:space:]]*override NSS_MAJOR=12$' package/qca-nss/nss-firmware/Makefile
          grep -qE '^[[:space:]]*override NSS_MINOR=5$' package/qca-nss/nss-firmware/Makefile
          grep -qE '^[[:space:]]*override NSS_REL=210$' package/qca-nss/nss-firmware/Makefile

      - name: Compile paired firmware and probe
        id: build
        run: |
          set -euo pipefail
          cd wrt
          make download -j"$(nproc)" 2>&1 | tee ../artifacts/nss-usbnet/logs/download.log
          if ! make -j"$(nproc)" 2>&1 | tee ../artifacts/nss-usbnet/logs/build.log; then
            make -j1 V=s 2>&1 | tee ../artifacts/nss-usbnet/logs/build-retry.log
          fi

      - name: Preserve outputs, config, feeds, NSS headers and ABI evidence
        if: always()
        env:
          NSS_USBNET_BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          if [[ -d wrt/.git ]]; then
            verify=()
            if [[ "$NSS_USBNET_BUILD_RESULT" == success ]]; then
              verify=(--verify)
            fi
            python3 Scripts/NSS-Usbnet-Artifacts.py wrt artifacts/nss-usbnet "${verify[@]}"
          fi

      - name: Upload experiment artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nss-usbnet-v0.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nss-usbnet/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

# Retrigger after enabling Actions
